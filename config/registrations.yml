# config/registrations.yml: vad pluginet lägger i de gemensamma lagren.
# Tomma listor betyder ingenting där; nycklarna
# får inte saknas. Fylls när pluginet byggs, ur manifestets Registreringar.
permissions: []
menu: []
drawer: []
notices: []
banners: []
waves: []
surfaces: []
color_roles:
  - {key: progress-text, group: core-stuff, label: label_gk_core_stuff_role_progress_text}   # the value as text on a progress bar
  - {key: progress-plate, group: core-stuff, label: label_gk_core_stuff_role_progress_plate}   # the plate behind that text, and the glow round it without the plate
records:
  targets: []
  note_kinds: []
  event_kinds: []
  link_kinds: []
strings:
  terms: []
text_levels: []
templates:
  kinds: []
scenario_steps:         # scenarios: steget core_stuff (looks:, ampm:) och kontrollerna cst_*
  - {key: core_stuff, order: 20}
corners: []
jobs: []
folds: []
copies: []
view_states: []

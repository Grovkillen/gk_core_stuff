en:
  label_gk_core_stuff_about: "About the plugin"
  label_gk_core_stuff_changelog: "Changelog"
  text_gk_core_stuff_changelog_english: "The change log is always written in English."
  text_gk_core_stuff_description: "Small fixes and additions to Redmine's own behaviour, one switchable module each, written as patches to core"
  text_gk_core_stuff_in_core: "Core already has this (the settings are under Administration > Settings > Issue tracking). The module does not hook in."
  label_gk_core_stuff_module_on: "On"
  label_gk_core_stuff_done_ratio_text: "% done as text"
  text_gk_core_stuff_done_ratio_text_info: "The percentage as text with the bar in issue lists and for Progress bar custom fields in lists, so the value can be copied and read by screen readers. The issue page and versions already show the text."
  label_gk_core_stuff_position: "Position"
  text_gk_core_stuff_position_info: "The issue on redmine.org stalled on the position; all four are here so core can choose."
  label_gk_core_stuff_position_right: "Beside the bar"
  label_gk_core_stuff_position_over: "On the bar"
  label_gk_core_stuff_position_under: "Below the bar"
  label_gk_core_stuff_position_hidden: "Hidden (screen readers and copying)"
  label_gk_core_stuff_zero: "Show 0% as text"
  label_gk_core_stuff_full: "Show 100% as text"
  label_gk_core_stuff_done_ratio_plate: "Plate behind the text"
  text_gk_core_stuff_done_ratio_plate: "When the text stands on the bar it gets a light plate behind it, so that it is read against both the green and the grey part. Off: core's white glow around the text."
  # exports: the names of core's exports (GkCoreStuff::Exports), for revisions' rule
  label_gk_core_stuff_export_issues: "Issue list"
  label_gk_core_stuff_export_issue: "Issue"
  label_gk_core_stuff_export_timelog: "Time entries"
  label_gk_core_stuff_export_time_report: "Time report"
  label_gk_core_stuff_export_users: "Users"
  label_gk_core_stuff_export_projects: "Projects"
  label_gk_core_stuff_export_members: "Members"
  label_gk_core_stuff_export_permissions: "Permissions"
  label_gk_core_stuff_export_issue_report: "Issue report"
  label_gk_core_stuff_export_gantt: "Gantt"
  label_gk_core_stuff_export_wiki_page: "Wiki page"
  label_gk_core_stuff_export_wiki: "Wiki"
  label_gk_core_stuff_export_version: "Version"
  label_gk_core_stuff_single_preference: "One preference row per user"
  text_gk_core_stuff_single_preference_info: "Redmine can get two rows of a user's preferences and then reads one and saves the other, so what was saved is lost. The module always reads the oldest row, asks the database before a new one is made and merges extra rows into one."
  # avatar_sources
  label_gk_core_stuff_avatar_sources: "Sources for pictures of users"
  text_gk_core_stuff_avatar_sources_info: "Other plugins can register sources for a user's picture (for example an uploaded picture, an icon or the organization's folder of photos). The sources are asked in order before Gravatar; the first that has a picture wins. With no source registered, or off, the picture is core's own."
  label_gk_core_stuff_avatar_sources_now: "Registered sources"
  # footer_version
  label_gk_core_stuff_footer_version: "Redmine version in the footer"
  text_gk_core_stuff_footer_version_info: "When on, the version (%{version}) follows Powered by Redmine in the footer, for everyone who sees the page, also one not signed in. Only the Redmine version, not the plugins. The pages in the browser only, not PDFs or exports. When core's line is hidden (GK GUI Stuff, Hidden), the version is not seen here; write <version> in GK GUI Stuff's own footer line instead."
  # minimagick_path
  label_gk_core_stuff_minimagick_path: "Gantt as PNG with ImageMagick 7"
  text_gk_core_stuff_minimagick_path_info: "When on, the Gantt chart as PNG is drawn with the ImageMagick that imagemagick_convert_command in configuration.yml names, when it is ImageMagick 7 (magick). Without it Redmine runs the command convert from the path, which on Windows is another program, and the PNG fails with an internal error. Applies after a restart."
  # settings_tabs
  label_gk_core_stuff_settings_tabs: "Register for tabs"
  text_gk_core_stuff_settings_tabs_info: "Other plugins can register tabs on the project, administration, user and group settings and in an issue's history, instead of overriding core's helpers. The module cannot be switched off, since other GK plugins show their tabs through the register. With nothing registered the pages are core's own."
  label_gk_core_stuff_settings_tabs_now: "Registered tabs"
  # journal_details
  label_gk_core_stuff_journal_details: "Register for history lines"
  text_gk_core_stuff_journal_details_info: "Other plugins can register how their own lines in an issue's history are drawn, on the page, in the email and as text, instead of overriding core's helper. The module cannot be switched off, since other GK plugins show their lines through the register. With nothing registered the lines are core's own."
  label_gk_core_stuff_journal_details_now: "Registered lines"
  # the hooks in core's views (layout_hooks, action_menus, form_hooks, list_hooks)
  label_gk_core_stuff_view_hooks: "Hooks in core's views"
  text_gk_core_stuff_view_hooks_info: "Other plugins can add content and actions to core's pages through hooks, instead of overriding core's views. The views are core's own with the hooks added, one copy per Redmine version. The modules cannot be switched off; without plugins that use the hooks the pages look as core's. Where a plugin already overrides one of the views, the plugin's is used."
  label_gk_core_stuff_view_hooks_views: "Views for this Redmine version"
  label_gk_core_stuff_view_hooks_used: "In use"
  label_gk_core_stuff_view_hooks_always: "Always on"
  text_gk_core_stuff_view_hooks_shadowed: "A plugin overrides %{views}; there the plugin's view is used, without the hooks."
  label_gk_core_stuff_layout_hooks: "The page's frame"
  text_gk_core_stuff_layout_hooks_info: "At the top and bottom of the header and the footer, at the top of the content and the sidebar, after the page title and around the issue on the issue page."
  label_gk_core_stuff_action_menus: "The button row and the menus"
  text_gk_core_stuff_action_menus_info: "The button row on sixteen pages, the actions menu on eight, and menus for an issue, the context menu of the issue list, a project, a user and a version."
  label_gk_core_stuff_form_hooks: "The forms"
  text_gk_core_stuff_form_hooks_info: "At the top and bottom of seven forms (group, issue and its custom fields, project, tracker, user, version) and after the issue's subject, description and attributes, the user's authentication and mail notifications."
  label_gk_core_stuff_list_hooks: "The lists"
  text_gk_core_stuff_list_hooks_info: "Classes on a row and content after the row in the lists of issues, projects and users."
  text_gk_core_stuff_layout_hooks_views_ok: "present"
  text_gk_core_stuff_layout_hooks_views_missing: "missing; the hooks in the views are not called"
  # time_ampm_nbsp
  label_gk_core_stuff_time_ampm_nbsp: "AM/PM on the same line as the time"
  text_gk_core_stuff_time_ampm_nbsp_info: "A time in the 12-hour clock (10:44 AM) gets a no-break space before AM or PM, so a narrow column never leaves AM or PM alone on the next line. A 24-hour clock is not changed, and a CSV keeps the ordinary space so a spreadsheet reads the time as before."
  # the looks: fixes of how core's own pages look or read
  label_gk_core_stuff_looks: "Looks"
  button_gk_core_stuff_recommend: "GK's recommendation"
  text_gk_core_stuff_recommend: "GK's recommendation sets every fix as GK recommends; Like core switches them all off, so that the pages are core's. The rows that change are marked. Nothing is saved until you press Apply."
  text_gk_core_stuff_recommend_changed: "%{count} fixes changed to GK's recommendation and marked. Press Apply to save."
  button_gk_core_stuff_core_mode: "Like core"
  text_gk_core_stuff_core_mode_changed: "%{count} fixes switched off, like core, and marked. Press Apply to save."
  text_gk_core_stuff_looks_info: "Small fixes of how core's own pages look or read, each written as a proposal to core. Off: core's look. Optional: on, and each person may switch it off under My account, Preferences. Forced: on for everyone."
  label_gk_core_stuff_look: "Fix"
  label_gk_core_stuff_look_mode: "Mode"
  label_gk_core_stuff_look_mode_off: "Off"
  label_gk_core_stuff_look_mode_optional: "Optional (each person may switch it off)"
  label_gk_core_stuff_look_mode_forced: "Forced (on for everyone)"
  text_gk_core_stuff_look_in_core: "Core already has the fix; the module does not hook in."
  label_gk_core_stuff_looks_mine: "Fixes of the look"
  text_gk_core_stuff_looks_mine: "What the administrator lets each person choose. Unticked: core's own look for that thing."
  label_gk_core_stuff_list_badge: "Badges in the middle of a list's row"
  text_gk_core_stuff_list_badge_info: "Core lifts a badge (such as Locked or Required) 4 px so that it sits right beside a heading. In a list it stands in the middle of the row instead, as the text beside it."
  label_gk_core_stuff_list_hash: "# before the issue number in lists"
  text_gk_core_stuff_list_hash_info: "The issue number in issue lists is written with # before it, as everywhere else (#12)."
  label_gk_core_stuff_heading_badge: "Badges level with the heading"
  text_gk_core_stuff_heading_badge_info: "The badges after a page's heading (the issue's status, Private) stand level with the middle of the heading's letters instead of core's 4 px lift."
  label_gk_core_stuff_list_checkbox: "The row's check box in the middle of the row"
  text_gk_core_stuff_list_checkbox_info: "The check box first in a list's row stands in the middle of the row; core puts it a little low."
  label_gk_core_stuff_sidebar_spacing: "Space between the sidebar's blocks"
  text_gk_core_stuff_sidebar_spacing_info: "A plugin's block in the sidebar (such as Tags) gets the same space to the block above it as core's own blocks have between them."
  label_gk_core_stuff_label_rows: "Text in line with its label"
  text_gk_core_stuff_label_rows_info: "A row of a form with only text or a link (no field) stands on the same line as the label to its left; core puts it 1 to 2 px too high."
  label_gk_core_stuff_scm_table: "The repositories table as a list"
  text_gk_core_stuff_scm_table_info: "The Enabled SCM table under Administration, Settings, Repositories is drawn as core's other lists: a heading row, lines between the rows, names and commands at the start of their columns."
  label_gk_core_stuff_warning_balance: "Equal margins in boxes without an icon"
  text_gk_core_stuff_warning_balance_info: "Core keeps 30 px at the start of a warning or info box for an icon. Without an icon the box gets the same margin on both sides."
  label_gk_core_stuff_menu_icons: "Menu icons in the row's colour"
  text_gk_core_stuff_menu_icons_info: "In a menu (the button row's and a note's ..., the issue list's right click) the row shows where the pointer is with its frame, background and blue text, but core turns the icon red as in an ordinary link. The icon gets the row's colour."
  label_gk_core_stuff_block_icons: "Move handles in the icons' colour"
  text_gk_core_stuff_block_icons_info: "The move handle in lists that can be sorted (custom fields, trackers, statuses, enumerations, roles) and in a box's heading on My page gets the colour of the icons beside it (core draws it grey), and the two groups of icons in a box on My page get the same space as the icons within a group."
  label_gk_core_stuff_list_align: "Headings like their columns"
  text_gk_core_stuff_list_align_info: "A list's heading is aligned like its column's cells when they all stand at the start (or the end); core centres every heading. Columns of descriptions or long texts are set to the start."
  label_gk_core_stuff_field_widths: "Equal widths for fields under each other"
  text_gk_core_stuff_field_widths_info: "Lists and text fields that stand straight under each other in a form, one per row, get the width of the widest of them, also when an explaining text stands between them. A heading, a section or a row of another kind between them ends the run, and fields elsewhere keep their own widths."
  label_gk_core_stuff_settings_widths: "Equal widths in core's settings"
  text_gk_core_stuff_settings_widths_info: "On core's settings pages every list and text field in one box (or one section of it) gets the width of the widest of them, also with check boxes and explanations between them. A field core makes short on purpose (such as a number) keeps its width."
  label_gk_core_stuff_control_heights: "Buttons and fields of one height"
  text_gk_core_stuff_control_heights_info: "Buttons and fields that stand on one line in the same box (a filter, a form's row) get the height of the highest of them, on core's pages too."
  label_gk_core_stuff_submit_word: "Save instead of Submit"
  text_gk_core_stuff_submit_word_info: "The button that saves a form gets Redmine's own word for Save instead of the word for Submit, in your language."
  label_gk_core_stuff_ajax_indicator: "The loading box in the middle of the list"
  text_gk_core_stuff_ajax_indicator_info: "When something loads from a list (the row menu, a change of the marked rows) Redmine's box Loading... stands in the middle of the list, on the marked row or rows, instead of in the middle of the window. The box itself is Redmine's."
  label_gk_core_stuff_native_texts: "The browser's texts in the page's language"
  text_gk_core_stuff_native_texts_info: "The message of a field that must be filled in or has the wrong form, and a file field's button and text, are written in the page's language instead of the browser's."
  label_gk_core_stuff_list_sort: "Check boxes in alphabetical order"
  text_gk_core_stuff_list_sort_info: "Check boxes that Redmine shows in its own order (a tracker's projects and custom fields, a custom field's projects) are shown in alphabetical order, projects under their parent project. Only the order on the screen changes: the same boxes and the same values are sent."
  gk_core_stuff_nt_required: "Fill in the field."
  gk_core_stuff_nt_choose: "Choose something in the list."
  gk_core_stuff_nt_check: "Tick the box to go on."
  gk_core_stuff_nt_email: "Write a whole email address, with @ and a domain after it."
  gk_core_stuff_nt_url: "Write a whole address that starts with https:// or http://."
  gk_core_stuff_nt_format: "The value is not in the form the field takes."
  gk_core_stuff_nt_short: "Write at least %{n} characters."
  gk_core_stuff_nt_long: "Write at most %{n} characters."
  gk_core_stuff_nt_min: "The value must be at least %{n}."
  gk_core_stuff_nt_max: "The value may be at most %{n}."
  gk_core_stuff_nt_file_choose: "Choose a file"
  gk_core_stuff_nt_files_choose: "Choose files"
  gk_core_stuff_nt_file_none: "No file chosen"
  gk_core_stuff_nt_files_n: "%{n} files chosen"

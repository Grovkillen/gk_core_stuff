en:
  label_gk_core_stuff_about: "About the plugin"
  text_gk_core_stuff_gui_stuff_missing: "GK GUI Stuff is missing. The pages, menus and API of GK Core Stuff are not active without it. Protection and traces hold all the same."
  text_gk_core_stuff_gui_stuff_required: "The installed GK GUI Stuff is too old. %{version} or later is required. The pages, menus and API of GK Core Stuff are not active without it. Protection and traces hold all the same."
  text_gk_core_stuff_gui_stuff_inactive: "GK GUI Stuff is installed in the right version but is not active. Its own settings page says why. The pages, menus and API of GK Core Stuff are not active until GK GUI Stuff is. Protection and traces hold all the same."
  label_gk_core_stuff_gui_stuff_settings: "GK GUI Stuff settings"
  text_gk_core_stuff_compat_missing: "GK Compat is missing. The pages, menus and API of GK Core Stuff are not active without it. Protection and traces hold all the same."
  text_gk_core_stuff_compat_required: "The installed GK Compat is too old. %{version} or later is required. The pages, menus and API of GK Core Stuff are not active without it. Protection and traces hold all the same."
  label_gk_core_stuff_in_core: "In Redmine"
  text_gk_core_stuff_always_locked: "Cannot be switched off: other plugins build on it."
  text_gk_core_stuff_description: "Small fixes and additions to Redmine's own behaviour, one switchable module each, written as patches to Redmine"
  text_gk_core_stuff_in_core: "Redmine already has this (the settings are under Administration > Settings > Issue tracking). The module does not hook in."
  label_gk_core_stuff_module_on: "On"
  label_gk_core_stuff_done_ratio_text: "% done as text"
  text_gk_core_stuff_done_ratio_text_info: "The percentage as text with the bar in issue lists and for Progress bar custom fields in lists, so the value can be copied and read by screen readers. The issue page and versions already show the text."
  label_gk_core_stuff_position: "Position"
  text_gk_core_stuff_position_info: "Where the percentage stands: beside the bar, on it, under it, or hidden but kept for screen readers and copying."
  label_gk_core_stuff_position_right: "Beside the bar"
  label_gk_core_stuff_position_over: "On the bar"
  label_gk_core_stuff_position_under: "Below the bar"
  label_gk_core_stuff_position_hidden: "Hidden (screen readers and copying)"
  label_gk_core_stuff_zero: "Show 0% as text"
  label_gk_core_stuff_full: "Show 100% as text"
  label_gk_core_stuff_done_ratio_plate: "Plate behind the text"
  text_gk_core_stuff_done_ratio_plate: "When the text stands on the bar it gets a light plate behind it, so that it is read against both the green and the grey part. Off: Redmine's white glow around the text."
  # exports: the names of core's exports (GkCoreStuff::Exports), for revisions' rule
  label_gk_core_stuff_export_issues: "Issue list"
  label_gk_core_stuff_export_issue: "Issue"
  label_gk_core_stuff_export_timelog: "Time entries"
  label_gk_core_stuff_export_time_report: "Time report"
  label_gk_core_stuff_export_users: "Users"
  label_gk_core_stuff_export_projects: "Projects"
  label_gk_core_stuff_export_members: "Members"
  label_gk_core_stuff_export_permissions: "Permissions"
  label_gk_core_stuff_export_issue_report: "Issue report"
  label_gk_core_stuff_export_gantt: "Gantt"
  label_gk_core_stuff_export_wiki_page: "Wiki page"
  label_gk_core_stuff_export_wiki: "Wiki"
  label_gk_core_stuff_export_version: "Version"
  label_gk_core_stuff_single_preference: "One preference row per user"
  text_gk_core_stuff_single_preference_info: "Redmine can get two rows of a user's preferences and then reads one and saves the other, so what was saved is lost. The module always reads the oldest row, asks the database before a new one is made and merges extra rows into one."
  # avatar_sources
  label_gk_core_stuff_avatar_sources: "Sources for pictures of users"
  text_gk_core_stuff_avatar_sources_info: "Other plugins can register sources for a user's picture (for example an uploaded picture, an icon or the organization's folder of photos). The sources are asked in order before Gravatar; the first that has a picture wins. With no source registered, or off, the picture is Redmine's own."
  label_gk_core_stuff_avatar_sources_now: "Registered sources"
  # footer_version
  label_gk_core_stuff_footer_version: "Redmine version in the footer"
  text_gk_core_stuff_footer_version_info: "When on, the version (%{version}) follows Powered by Redmine in the footer, for everyone who sees the page, also one not signed in. Only the Redmine version, not the plugins. The pages in the browser only, not PDFs or exports. Where another plugin draws its own page frame instead of Redmine's, the version is not shown. When Redmine's line is hidden (GK GUI Stuff, Hidden), the version is not seen here; write <version> in GK GUI Stuff's own footer line instead."
  # minimagick_path
  label_gk_core_stuff_minimagick_path: "Gantt as PNG with ImageMagick 7"
  text_gk_core_stuff_minimagick_path_info: "When on, the Gantt chart as PNG is drawn with the ImageMagick that imagemagick_convert_command in configuration.yml names, when it is ImageMagick 7 (magick). Without it Redmine runs the command convert from the path, which on Windows is another program, and the PNG fails with an internal error. Applies after a restart."
  # settings_tabs
  label_gk_core_stuff_settings_tabs: "Register for tabs"
  text_gk_core_stuff_settings_tabs_info: "Other plugins can register tabs on the project, administration, user and group settings and in an issue's history, instead of overriding Redmine's helpers. The module cannot be switched off, since other GK plugins show their tabs through the register. With nothing registered the pages are Redmine's own."
  label_gk_core_stuff_settings_tabs_now: "Registered tabs"
  # journal_details
  label_gk_core_stuff_journal_details: "Register for history lines"
  text_gk_core_stuff_journal_details_info: "Other plugins can register how their own lines in an issue's history are drawn, on the page, in the email and as text, instead of overriding Redmine's helper. The module cannot be switched off, since other GK plugins show their lines through the register. With nothing registered the lines are Redmine's own."
  label_gk_core_stuff_journal_details_now: "Registered lines"
  # formatting_processors
  label_gk_core_stuff_formatting_processors: "Links and text in formatted text"
  text_gk_core_stuff_formatting_processors_info: "Other plugins can mark the links and words of formatted text (wiki pages, descriptions, notes) in one shared pass after the text is formatted, instead of each reading and rewriting the finished page. The links in custom field values (the format Link and link patterns) go through the same pass. The module cannot be switched off, since other GK plugins mark links, icons and tags through it. With nothing registered the text is Redmine's own and is not read again."
  label_gk_core_stuff_formatting_processors_now: "Registered plugins"
  text_gk_core_stuff_formatting_processors_values_info: "Redmine marks the formatted text itself. The links in custom field values (the format Link and link patterns) still go through this plugin's pass, with the plugins registered here."
  # report_marks
  label_gk_core_stuff_report_marks: "Marks in the issue reports"
  text_gk_core_stuff_report_marks_info: "Every count in the issue reports (Summary and the detailed table) stands in a mark saying whether it is a status (with the status's id and whether it is closed), the open ones, the closed ones or the total, so that other plugins know what a column is without going by its place, its heading's words or a status's name. The module cannot be switched off; the marks do not show, and without a plugin that reads them the report looks as Redmine's."
  # principal_marks
  label_gk_core_stuff_principal_marks: "Marks on the links to people and groups"
  text_gk_core_stuff_principal_marks_info: "Every link to a user or a group gets a mark with the user's or group's id, so that other plugins know whose name it is without going by the link's address or text. Where Redmine writes only the name, without a link, there is no mark. The module cannot be switched off; the mark does not show, and the links look as Redmine's."
  # breadcrumb_marks
  label_gk_core_stuff_breadcrumb_marks: "Marks in the header's project path"
  text_gk_core_stuff_breadcrumb_marks_info: "Every project link in the project path at the top of the page (the root project and the projects between) gets a mark with the project's identifier, so that other plugins know where a link leads without counting links and separators. The module cannot be switched off; the mark does not show, and the project path looks as Redmine's."
  # menu_marks
  label_gk_core_stuff_menu_marks: "Marks on the menus' links"
  text_gk_core_stuff_menu_marks_info: "Every link Redmine draws in a menu (the top menu, the account menu, the project's tabs, the administration) gets a mark with the menu's name, so that other plugins know which menu a link stands in without going by where the link sits on the page. The module cannot be switched off; the mark does not show, and the menus look as Redmine's."
  # the hooks in core's views (layout_hooks, action_menus, form_hooks, list_hooks, more_view_hooks) and the marks (section_marks, anchor_marks)
  label_gk_core_stuff_view_hooks: "Hooks in Redmine's views"
  text_gk_core_stuff_view_hooks_info: "Other plugins can add content and actions to Redmine's pages through hooks, instead of overriding Redmine's views. The views are Redmine's own with the hooks added, one copy per Redmine version. The modules cannot be switched off; without plugins that use the hooks the pages look as Redmine's. Where a plugin already overrides one of the views, the plugin's is used."
  label_gk_core_stuff_view_hooks_views: "Views for this Redmine version"
  label_gk_core_stuff_view_hooks_used: "In use"
  label_gk_core_stuff_view_hooks_always: "Always on"
  text_gk_core_stuff_view_hooks_shadowed: "A plugin overrides %{views}; there the plugin's view is used, without the hooks."
  text_gk_core_stuff_view_marks_shadowed: "A plugin overrides %{views}; there the plugin's view is used, without the marks, and plugins that go by them do not find what they mark there."
  text_gk_core_stuff_view_marks_views_missing: "missing; the pages get no marks, and plugins that go by them do not find what they mark"
  label_gk_core_stuff_layout_hooks: "The page's frame"
  text_gk_core_stuff_layout_hooks_info: "At the top and bottom of the header and the footer, at the top of the content and the sidebar, after the page title and around the issue on the issue page."
  label_gk_core_stuff_action_menus: "The button row and the menus"
  text_gk_core_stuff_action_menus_info: "The button row on sixteen pages, the actions menu on eight, and menus for an issue, the context menu of the issue list, a project, a user and a version."
  label_gk_core_stuff_form_hooks: "The forms"
  text_gk_core_stuff_form_hooks_info: "At the top and bottom of seven forms (group, issue and its custom fields, project, tracker, user, version) and after the issue's subject, description and attributes, the user's authentication and mail notifications."
  label_gk_core_stuff_list_hooks: "The lists"
  text_gk_core_stuff_list_hooks_info: "Classes on a row and content after the row in the lists of issues, projects and users."
  label_gk_core_stuff_anchor_marks: "Marks on the pages"
  text_gk_core_stuff_anchor_marks_info: "Fixed marks (classes and data attributes) on parts of Redmine's pages that other plugins change: the header's title, the issue's heading and subject, the name column of the workflow tables, the columns of the issue report, the rows of an attachment list, the rows of the issue form and the bulk edit form, the version control table, the query form's buttons and the Gantt chart's and calendar's own controls, Delete in the context menu, the issue form's attributes and the link that opens the description, Add for subtasks and related issues, and Save in bulk editing and the settings. No hooks; without a plugin that reads the marks the pages look as Redmine's."
  label_gk_core_stuff_more_view_hooks: "More places"
  text_gk_core_stuff_more_view_hooks_info: "After the link to Redmine in the footer, after the author line on the issue page, under a document's details, beside Save in every settings form, after the Information box on My account, before the issue list on its page, and at the top of every issue list, also in the blocks of My page."
  label_gk_core_stuff_section_marks: "The issue page's sections"
  text_gk_core_stuff_section_marks_info: "Fixed marks on the issue page's sections (Description, Files, Subtasks, Related issues) and their headings, so that other plugins find a section without matching its heading's words. No hooks; without a plugin that reads the marks the page looks as Redmine's."
  text_gk_core_stuff_layout_hooks_views_ok: "present"
  text_gk_core_stuff_layout_hooks_views_missing: "missing; the hooks in the views are not called"
  # time_ampm_nbsp
  label_gk_core_stuff_time_ampm_nbsp: "AM/PM on the same line as the time"
  text_gk_core_stuff_time_ampm_nbsp_info: "A time in the 12-hour clock (10:44 AM) gets a no-break space before AM or PM, so a narrow column never leaves AM or PM alone on the next line. A 24-hour clock is not changed, and a CSV keeps the ordinary space so a spreadsheet reads the time as before. The change lies inside the text and has no element of its own, so the marks after a save count no places for it."
  # the looks: fixes of how core's own pages look or read
  label_gk_core_stuff_list_badge: "Status badges in the middle of a list's row"
  text_gk_core_stuff_list_badge_info: "Redmine lifts a badge (such as Locked or Required) 4 px so that it sits right beside a heading. In a list it stands in the middle of the row instead, as the text beside it."
  label_gk_core_stuff_list_hash: "# before the issue number in lists"
  text_gk_core_stuff_list_hash_info: "The issue number in issue lists is written with # before it, as everywhere else (#12)."
  label_gk_core_stuff_heading_badge: "Status badges level with the heading"
  text_gk_core_stuff_heading_badge_info: "The badges after a page's heading (the issue's status, Private) stand level with the middle of the heading's letters instead of Redmine's 4 px lift."
  label_gk_core_stuff_list_checkbox: "The row's check box in the middle of the row"
  text_gk_core_stuff_list_checkbox_info: "The check box first in a list's row stands in the middle of the row; Redmine puts it a little low."
  label_gk_core_stuff_dark_mode: "Dark mode"
  label_gk_core_stuff_dark_mode_mode: "Light, dark or automatic"
  label_gk_core_stuff_dark_mode_light: "Light"
  label_gk_core_stuff_dark_mode_dark: "Dark"
  label_gk_core_stuff_dark_mode_auto: "Automatic"
  text_gk_core_stuff_dark_mode_choice_info: "Holds under Forced, for everyone, and for someone not logged in. Under Optional each person chooses, and whoever has not chosen follows the device."
  text_gk_core_stuff_dark_mode_info: "Light, dark or automatic for Redmine's pages. Automatic follows the phone's or computer's setting and changes along when the device changes. Off: no dark mode, the pages are always light. Optional: each person chooses light, dark or automatic under My account, Appearance, and whoever has not chosen follows the device. Forced: the value here holds for everyone. The dark mode covers Redmine's own page, menus, tables, forms, messages, tabs, history, wiki, calendar and badges; the header and the top menu keep Redmine's colours, and code keeps its light ground so that its highlighting reads as in the light mode. A theme may lay its own colours on top. Printed pages are always light."
  label_gk_core_stuff_chart_colors: "Charts in the page's colours"
  text_gk_core_stuff_chart_colors_info: "Off from the start: Redmine's own chart colours hold until someone switches this on. Switched on, while the page is dark, or while a theme draws the page, Redmine's charts (the details of the issue report and the repository's statistics) take the category colours in turn and start over after ten: the edge in the colour and the fill in its soft tone. Text, grid, axes and the tooltip follow the page's colours. The repository's revision graph and the lines in the Gantt chart's drawing (the relation lines and the progress line) keep their hues but are made light or dark enough to hold a contrast of 3:1 against the surface, and so is the Gantt chart's today line, which the progress line takes its colour from. The colour boxes in the Gantt chart's filter stay as Redmine draws them. In the light mode without a theme nothing changes, and a chart is drawn again when the mode changes on an open page."
  label_gk_core_stuff_sidebar_spacing: "Space between the sidebar's blocks"
  text_gk_core_stuff_sidebar_spacing_info: "A plugin's block in the sidebar (such as Tags) gets the same space to the block above it as Redmine's own blocks have between them."
  label_gk_core_stuff_label_rows: "Text in line with its label"
  text_gk_core_stuff_label_rows_info: "A row of a form with only text or a link (no field) stands on the same line as the label to its left; Redmine puts it 1 to 2 px too high."
  label_gk_core_stuff_scm_table: "The repositories table as a list"
  text_gk_core_stuff_scm_table_info: "The Enabled SCM table under Administration, Settings, Repositories is drawn as Redmine's other lists: a heading row, lines between the rows, names and commands at the start of their columns."
  label_gk_core_stuff_warning_balance: "Equal margins in boxes without an icon"
  text_gk_core_stuff_warning_balance_info: "Redmine keeps 30 px at the start of a warning or info box for an icon. Without an icon the box gets the same margin on both sides."
  label_gk_core_stuff_menu_icons: "Menu icons in the row's colour"
  text_gk_core_stuff_menu_icons_info: "In a menu (the button row's and a note's ..., the issue list's right click) the row shows where the pointer is with its frame, background and blue text, but Redmine turns the icon red as in an ordinary link. The icon gets the row's colour."
  label_gk_core_stuff_role_progress_text: "The text on a progress bar"
  label_gk_core_stuff_role_progress_plate: "The plate behind the text on a progress bar"
  label_gk_core_stuff_external_links: "External links shown as external"
  text_gk_core_stuff_external_links_info: "A link to another website in a text gets the colour of what is external, a dotted underline and an icon after the link text instead of Redmine's small image before it; the icon never ends up alone on a new line. With GK GUI Stuff the domain is in the tooltip and a link to the instance's own address is drawn as an internal link. A link to an e-mail address gets Redmine's e-mail icon. The icons are not printed."
  label_gk_core_stuff_ext_place_field_link: "Custom fields of the format Link"
  text_gk_core_stuff_ext_place_field_link_info: "The link in a custom field of the format Link is shown as external, on the page and in the lists. Marked by GK GUI Stuff."
  label_gk_core_stuff_ext_place_url_pattern: "Link values to URL"
  text_gk_core_stuff_ext_place_url_pattern_info: "The link a custom field of another format gets through Link values to URL is shown as external. Marked by GK GUI Stuff."
  label_gk_core_stuff_ext_place_project_homepage: "The project's homepage"
  text_gk_core_stuff_ext_place_project_homepage_info: "The homepage on the project's overview is shown as external, as in the project list. Marked by GK GUI Stuff."
  label_gk_core_stuff_ext_place_people: "GK People: website, channels and identifiers"
  text_gk_core_stuff_ext_place_people_info: "The organisation's website and the person's links under Reach the person and Identifiers are shown as external. Marked by GK GUI Stuff when GK People is there."
  label_gk_core_stuff_ext_place_icons: "GK Icons: the packs' homepage and download"
  text_gk_core_stuff_ext_place_icons_info: "The links to the icon packs' homepage and download under Recipes for common packs are shown as external. Marked by GK GUI Stuff when GK Icons is there."
  label_gk_core_stuff_block_icons: "Move handles in the icons' colour"
  text_gk_core_stuff_block_icons_info: "The move handle in lists that can be sorted (custom fields, trackers, statuses, enumerations, roles) and in a box's heading on My page gets the colour of the icons beside it (Redmine draws it grey), and the two groups of icons in a box on My page get the same space as the icons within a group."
  label_gk_core_stuff_list_align: "Headings like their columns"
  text_gk_core_stuff_list_align_info: "A list's heading is aligned like its column's cells when they all stand at the start (or the end); Redmine centres every heading. Columns of descriptions, notes, comments or text custom fields are set to the start. This applies to lists where Redmine gives the heading and the cells the column's class (issues, time entries, projects, users); other lists keep Redmine's headings."
  label_gk_core_stuff_field_widths: "Equal widths for fields under each other"
  text_gk_core_stuff_field_widths_info: "Lists and text fields that stand straight under each other in a form, one per row, get the width of the widest of them, also when an explaining text stands between them. A text area, a check box, a field that starts elsewhere or a new section ends the run, and fields elsewhere keep their own widths."
  label_gk_core_stuff_settings_widths: "Equal widths in Redmine's settings"
  text_gk_core_stuff_settings_widths_info: "On Redmine's settings pages every list and text field in one box (or one section of it) gets the width of the widest of them, also with check boxes and explanations between them. A field Redmine makes short on purpose (such as a number) keeps its width."
  label_gk_core_stuff_control_heights: "Buttons and fields of one height"
  text_gk_core_stuff_control_heights_info: "Buttons and fields of one form that stand side by side on one line (a filter, a form's row) get the height of the highest of them, on Redmine's pages too."
  label_gk_core_stuff_submit_word: "Save instead of Submit"
  text_gk_core_stuff_submit_word_info: "The button that saves a form gets Redmine's own word for Save instead of the word for Submit, in your language."
  label_gk_core_stuff_ajax_indicator: "The loading box in the middle of the list"
  text_gk_core_stuff_ajax_indicator_info: "When something loads from a list (the row menu, a change of the marked rows) Redmine's box Loading... stands in the middle of the list, on the marked row or rows, instead of in the middle of the window. The box itself is Redmine's."
  label_gk_core_stuff_native_texts: "The browser's texts in the page's language"
  text_gk_core_stuff_native_texts_info: "The message of a field that must be filled in or has the wrong form, and a file field's button and text, are written in the page's language instead of the browser's."
  label_gk_core_stuff_list_sort: "Check boxes in alphabetical order"
  text_gk_core_stuff_list_sort_info: "Check boxes that Redmine shows in its own order (a tracker's projects and custom fields, a custom field's projects) are shown in alphabetical order, projects under their parent project. Only the order on the screen changes: the same boxes and the same values are sent."
  text_gk_core_stuff_step_list_sort_1: "Open a tracker under Administration, Trackers."
  text_gk_core_stuff_step_list_sort_2: "The projects and the custom fields stand in alphabetical order, the projects under their parent project."
  text_gk_core_stuff_step_list_sort_3: "Only the order on the screen changes: the same boxes and the same values are sent."
  gk_core_stuff_nt_required: "Fill in the field."
  gk_core_stuff_nt_choose: "Choose something in the list."
  gk_core_stuff_nt_check: "Tick the box to go on."
  gk_core_stuff_nt_email: "Write a whole email address, with @ and a domain after it."
  gk_core_stuff_nt_url: "Write a whole address that starts with https:// or http://."
  gk_core_stuff_nt_format: "The value is not in the form the field takes."
  gk_core_stuff_nt_short: "Write at least %{n} characters."
  gk_core_stuff_nt_long: "Write at most %{n} characters."
  gk_core_stuff_nt_min: "The value must be at least %{n}."
  gk_core_stuff_nt_max: "The value may be at most %{n}."
  gk_core_stuff_nt_file_choose: "Choose a file"
  gk_core_stuff_nt_files_choose: "Choose files"
  gk_core_stuff_nt_file_none: "No file chosen"
  gk_core_stuff_nt_files_n: "%{n} files chosen"

# Revision: 0.00.000
sv:
  label_gk_core_stuff_about: "Om pluginet"
  label_gk_core_stuff_changelog: "Ändringslogg"
  text_gk_core_stuff_changelog_english: "Ändringsloggen skrivs alltid på engelska."
  text_gk_core_stuff_description: "Små rättelser och tillägg i Redmines eget beteende, en avstängbar modul per sak, skrivna som patchar till core"
  text_gk_core_stuff_in_core: "Core har redan det här (inställningarna finns under Administration > Inställningar > Ärendehantering). Modulen kopplar inte in sig."
  label_gk_core_stuff_module_on: "På"
  label_gk_core_stuff_done_ratio_text: "% klart som text"
  text_gk_core_stuff_done_ratio_text_info: "Procenten som text vid stapeln i ärendelistor och för fält av typen Progress bar i listor, så att värdet kan kopieras och läsas av skärmläsare. Ärendesidan och versionerna har redan texten."
  label_gk_core_stuff_position: "Placering"
  text_gk_core_stuff_position_info: "Ärendet på redmine.org fastnade på placeringen; alla fyra finns så att core kan välja."
  label_gk_core_stuff_position_right: "Bredvid stapeln"
  label_gk_core_stuff_position_over: "På stapeln"
  label_gk_core_stuff_position_under: "Under stapeln"
  label_gk_core_stuff_position_hidden: "Dold (skärmläsare och kopiering)"
  label_gk_core_stuff_zero: "Visa 0 % som text"
  label_gk_core_stuff_full: "Visa 100 % som text"
  label_gk_core_stuff_done_ratio_plate: "Platta bakom texten"
  text_gk_core_stuff_done_ratio_plate: "När texten står på stapeln får den en ljus platta bakom sig, så att den läses mot både den gröna och den grå delen. Av: core:s vita skugga runt texten."
  # export_names
  label_gk_core_stuff_export_names: "Filnamn för core:s exporter"
  text_gk_core_stuff_export_names_info: "Det core skriver ut (ärendelistor, ett ärende, tid, användare, projekt, medlemmar, behörigheter, rapporter, gantt, wikisidor och wikin, en version) får sitt namn ur samma regel som pluginens. Bilagor och filer ur kodförråd behåller alltid sina namn. Mönstren sätts under"
  text_gk_core_stuff_export_names_no_engine: "revisions saknas, så core namnger som förut."
  label_gk_core_stuff_export_issues: "Ärendelista"
  label_gk_core_stuff_export_issue: "Ärende"
  label_gk_core_stuff_export_timelog: "Tidrapporter"
  label_gk_core_stuff_export_time_report: "Tidsrapport"
  label_gk_core_stuff_export_users: "Användare"
  label_gk_core_stuff_export_projects: "Projekt"
  label_gk_core_stuff_export_members: "Medlemmar"
  label_gk_core_stuff_export_permissions: "Behörigheter"
  label_gk_core_stuff_export_issue_report: "Ärenderapport"
  label_gk_core_stuff_export_gantt: "Gantt"
  label_gk_core_stuff_export_wiki_page: "Wikisida"
  label_gk_core_stuff_export_wiki: "Wiki"
  label_gk_core_stuff_export_version: "Version"
  # export_log
  label_gk_core_stuff_export_log: "Logg över exporter, nedladdningar och utskrifter"
  text_gk_core_stuff_export_log_info: "Varje export (core:s och pluginens), varje nedladdad bilaga och varje utskrift som begärs i webbläsaren blir en händelse på det den gäller: vem, när, filnamn, kontrollsumma (SHA-256), storlek, urval och antal rader, och IP-adress. Utskrift betyder att utskriften begärdes; webbläsaren säger inte om papper kom ut. Syns för den som har behörigheten Se exporter och utskrifter i projektet."
  permission_gk_core_stuff_view_exports: "Se exporter och utskrifter"
  label_gk_core_stuff_event_exported: "Exporterad"
  label_gk_core_stuff_event_attachment_downloaded: "Bilaga nedladdad"
  label_gk_core_stuff_event_printed: "Utskrift begärd"
  label_gk_core_stuff_single_preference: "En inställningsrad per användare"
  text_gk_core_stuff_single_preference_info: "Redmine kan få två rader med en användares inställningar och läser då den ena och sparar den andra, så att det som sparats går förlorat. Modulen läser alltid den äldsta raden, frågar databasen innan en ny skapas och slår ihop extra rader till en."
  label_gk_core_stuff_with_manifest: "med manifest"
  text_gk_core_stuff_with_manifest: "Laddar ned en zip med filen och manifest.json: källa, väg, format, tider, konto, antal rader, storlek och SHA-256."
  # avatar_sources
  label_gk_core_stuff_avatar_sources: "Källor för bilder på användare"
  text_gk_core_stuff_avatar_sources_info: "Andra plugin kan anmäla källor för bilden på en användare (till exempel en egen bild, en ikon eller organisationens bildmapp). Källorna frågas i tur och ordning före Gravatar; den första som har en bild vinner. Utan anmälda källor, eller av, är bilden core:s egen."
  label_gk_core_stuff_avatar_sources_now: "Anmälda källor"
  # footer_version
  label_gk_core_stuff_footer_version: "Redmines version i sidfoten"
  text_gk_core_stuff_footer_version_info: "Påslagen står versionen (%{version}) efter Powered by Redmine i sidfoten, för alla som ser sidan, också den som inte är inloggad. Bara Redmines version, inte pluginens. Gäller sidorna i webbläsaren, inte PDF:er eller exporter. Har core:s rad tagits bort (GK GUI Stuff, Dolt) syns versionen inte här; skriv då <version> i GK GUI Stuff:s egen rad i sidfoten."
  # minimagick_path
  label_gk_core_stuff_minimagick_path: "Gantt som PNG med ImageMagick 7"
  text_gk_core_stuff_minimagick_path_info: "Påslagen ritas Gantt som PNG med den ImageMagick som imagemagick_convert_command i configuration.yml pekar på, när den är ImageMagick 7 (magick). Utan den kör Redmine kommandot convert ur sökvägen, som i Windows är ett annat program, och PNG:en ger ett internt fel. Gäller efter omstart."
  # view_registries
  label_gk_core_stuff_view_registries: "Register för flikar och historikrader"
  text_gk_core_stuff_view_registries_info: "Andra plugin kan anmäla flikar på projektets, administrationens, användarens och gruppens inställningar och i ärendets historik, och hur deras egna rader i ärendets historik ritas, i stället för att skriva över core:s hjälpmetoder. Utan anmälningar, eller av, är sidorna core:s egna."
  label_gk_core_stuff_view_registries_now: "Anmälda flikar och rader"
  # time_ampm_nbsp
  label_gk_core_stuff_time_ampm_nbsp: "AM/PM på samma rad som klockslaget"
  text_gk_core_stuff_time_ampm_nbsp_info: "Ett klockslag med 12-timmarsklocka (10:44 AM) får ett hårt mellanslag före AM eller PM, så att en smal kolumn aldrig lämnar AM eller PM ensamt på nästa rad. En 24-timmarsklocka ändras inte, och en CSV behåller det vanliga mellanslaget så att ett kalkylark läser tiden som förut."
  # the looks: fixes of how core's own pages look or read
  label_gk_core_stuff_looks: "Utseende"
  button_gk_core_stuff_recommend: "GK:s rekommendation"
  text_gk_core_stuff_recommend: "GK:s rekommendation ställer varje rättelse så som GK rekommenderar; Som core stänger av alla, så att sidorna är core:s. De rader som ändras markeras. Inget sparas förrän du trycker Verkställ."
  text_gk_core_stuff_recommend_changed: "%{count} rättelser ändrade till GK:s rekommendation och markerade. Tryck Verkställ för att spara."
  button_gk_core_stuff_core_mode: "Som core"
  text_gk_core_stuff_core_mode_changed: "%{count} rättelser avstängda, som core, och markerade. Tryck Verkställ för att spara."
  text_gk_core_stuff_looks_info: "Små rättelser av hur core:s egna sidor ser ut eller läses, var och en skriven som förslag till core. Avstängd: core:s utseende. Valfri: på, och var och en kan stänga av den under Mitt konto, Inställningar. Tvingad: på för alla."
  label_gk_core_stuff_look: "Rättelse"
  label_gk_core_stuff_look_mode: "Läge"
  label_gk_core_stuff_look_mode_off: "Avstängd"
  label_gk_core_stuff_look_mode_optional: "Valfri (var och en kan stänga av)"
  label_gk_core_stuff_look_mode_forced: "Tvingad (på för alla)"
  text_gk_core_stuff_look_in_core: "Core har redan rättelsen; modulen kopplar inte in sig."
  label_gk_core_stuff_looks_mine: "Rättelser av utseendet"
  text_gk_core_stuff_looks_mine: "Det administratören låter var och en välja. Ur kryssat: core:s eget utseende för just den saken."
  label_gk_core_stuff_list_badge: "Etiketter mitt i listans rad"
  text_gk_core_stuff_list_badge_info: "Core lyfter en etikett (som Låst eller Krävs) 4 px för att den ska sitta rätt bredvid en rubrik. I en lista står den i stället mitt i raden, som texten bredvid."
  label_gk_core_stuff_list_hash: "# framför ärendenumret i listor"
  text_gk_core_stuff_list_hash_info: "Ärendenumret i ärendelistor skrivs med # framför, som på alla andra ställen (#12)."
  label_gk_core_stuff_heading_badge: "Etiketter mitt för rubriken"
  text_gk_core_stuff_heading_badge_info: "Etiketterna efter en sidas rubrik (ärendets status, Privat) står mitt för rubrikens bokstäver i stället för core:s lyft på 4 px."
  label_gk_core_stuff_list_checkbox: "Radens kryssruta mitt i raden"
  text_gk_core_stuff_list_checkbox_info: "Kryssrutan först i en listas rad står mitt i raden; core lägger den lite för lågt."
  label_gk_core_stuff_sidebar_spacing: "Avstånd mellan sidofältets block"
  text_gk_core_stuff_sidebar_spacing_info: "Ett plugins block i sidofältet (till exempel Taggar) får samma avstånd till blocket ovanför som core:s egna block har mellan sig."
  label_gk_core_stuff_label_rows: "Text i linje med sin etikett"
  text_gk_core_stuff_label_rows_info: "En rad i ett formulär som bara har text eller en länk (inget fält) står på samma linje som etiketten till vänster; core lägger den 1 till 2 px för högt."
  label_gk_core_stuff_scm_table: "Versionsarkivens tabell som en lista"
  text_gk_core_stuff_scm_table_info: "Tabellen Aktivera SCM under Administration, Inställningar, Versionsarkiv ritas som core:s andra listor: en rubrikrad, linjer mellan raderna, namn och kommandon i början av kolumnerna."
  label_gk_core_stuff_warning_balance: "Lika marginal i rutor utan ikon"
  text_gk_core_stuff_warning_balance_info: "Core håller 30 px i början av en varnings- eller inforuta för en ikon. Utan ikon får rutan samma marginal på båda sidor."
  label_gk_core_stuff_block_icons: "Flytthandtag i ikonernas färg"
  text_gk_core_stuff_block_icons_info: "Flytthandtaget i listor som går att sortera (anpassade fält, ärendetyper, statusar, värdelistor, roller) och i ett blocks rubrik på Min sida får samma färg som ikonerna bredvid (core gör det grått), och blockets två grupper av ikoner på Min sida får samma avstånd som ikonerna inom en grupp."
  label_gk_core_stuff_list_align: "Rubriker som sina kolumner"
  text_gk_core_stuff_list_align_info: "En rubrik i en lista ställs som kolumnens celler när alla står i början (eller i slutet); core centrerar alla rubriker. Kolumner med beskrivningar eller långa texter ställs i början."
  label_gk_core_stuff_field_widths: "Lika breda fält under varandra"
  text_gk_core_stuff_field_widths_info: "Listor och textfält som står direkt under varandra i ett formulär, ett per rad, får samma bredd som det bredaste av dem, också när en förklarande text står emellan. En rubrik, ett avsnitt eller en annan sorts rad emellan bryter raden av fält, och fälten på andra ställen behåller sina egna bredder."
  label_gk_core_stuff_settings_widths: "Lika breda fält i core:s inställningar"
  text_gk_core_stuff_settings_widths_info: "På core:s inställningssidor får alla listor och textfält i en ruta (eller ett avsnitt av den) samma bredd som det bredaste av dem, också med kryssrutor och förklaringar emellan. Ett fält som core gör kort med avsikt (som ett tal) behåller sin bredd."
  label_gk_core_stuff_control_heights: "Lika höga knappar och fält"
  text_gk_core_stuff_control_heights_info: "Knappar och fält som står på samma rad i samma ruta (ett filter, en rad i ett formulär) får samma höjd som det högsta av dem, också på core:s sidor."
  label_gk_core_stuff_submit_word: "Spara i stället för Skicka"
  text_gk_core_stuff_submit_word_info: "Knappen som sparar ett formulär får Redmines eget ord för Spara i stället för ordet för Skicka, på det språk du har."
  label_gk_core_stuff_ajax_indicator: "Laddar-rutan mitt på listan"
  text_gk_core_stuff_ajax_indicator_info: "När något laddas från en lista (radens meny, ändring av markerade rader) står Redmines ruta Laddar... mitt på listan, på den eller de markerade raderna, i stället för mitt i fönstret. Rutan själv är Redmines."
  label_gk_core_stuff_native_texts: "Webbläsarens texter på sidans språk"
  text_gk_core_stuff_native_texts_info: "Meddelandet för ett fält som måste fyllas i eller har fel form, och filfältets knapp och text, skrivs på sidans språk i stället för webbläsarens."
  label_gk_core_stuff_list_sort: "Kryssrutor i bokstavsordning"
  text_gk_core_stuff_list_sort_info: "Kryssrutor som core visar i sin egen ordning (en ärendetyps projekt och anpassade fält, ett anpassat fälts projekt) visas i bokstavsordning, projekten under sitt överordnade projekt. Bara ordningen på skärmen ändras: samma rutor och samma värden skickas."
  gk_core_stuff_nt_required: "Fyll i fältet."
  gk_core_stuff_nt_choose: "Välj något i listan."
  gk_core_stuff_nt_check: "Kryssa i rutan för att fortsätta."
  gk_core_stuff_nt_email: "Skriv en hel e-postadress, med @ och en domän efter."
  gk_core_stuff_nt_url: "Skriv en hel adress som börjar med https:// eller http://."
  gk_core_stuff_nt_format: "Värdet har inte den form fältet tar emot."
  gk_core_stuff_nt_short: "Skriv minst %{n} tecken."
  gk_core_stuff_nt_long: "Skriv högst %{n} tecken."
  gk_core_stuff_nt_min: "Värdet måste vara minst %{n}."
  gk_core_stuff_nt_max: "Värdet får vara högst %{n}."
  gk_core_stuff_nt_file_choose: "Välj fil"
  gk_core_stuff_nt_files_choose: "Välj filer"
  gk_core_stuff_nt_file_none: "Ingen fil vald"
  gk_core_stuff_nt_files_n: "%{n} filer valda"

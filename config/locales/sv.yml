sv:
  label_gk_core_stuff_about: "Om pluginet"
  text_gk_core_stuff_gui_stuff_missing: "GK GUI Stuff saknas. Sidorna, menyerna och API:t i GK Core Stuff är inte aktiva utan det. Skydd och spår gäller ändå."
  text_gk_core_stuff_gui_stuff_required: "Den installerade GK GUI Stuff är för gammal. %{version} eller senare krävs. Sidorna, menyerna och API:t i GK Core Stuff är inte aktiva utan det. Skydd och spår gäller ändå."
  text_gk_core_stuff_gui_stuff_inactive: "GK GUI Stuff är installerat i rätt version men är inte aktivt. Skälet står på dess egen inställningssida. Sidorna, menyerna och API:t i GK Core Stuff är inte aktiva förrän GK GUI Stuff är det. Skydd och spår gäller ändå."
  label_gk_core_stuff_gui_stuff_settings: "Inställningar för GK GUI Stuff"
  text_gk_core_stuff_compat_missing: "GK Compat saknas. Sidorna, menyerna och API:t i GK Core Stuff är inte aktiva utan det. Skydd och spår gäller ändå."
  text_gk_core_stuff_compat_required: "Den installerade GK Compat är för gammal. %{version} eller senare krävs. Sidorna, menyerna och API:t i GK Core Stuff är inte aktiva utan det. Skydd och spår gäller ändå."
  label_gk_core_stuff_in_core: "Finns i Redmine"
  text_gk_core_stuff_always_locked: "Går inte att stänga av: andra plugin bygger på den."
  text_gk_core_stuff_description: "Små rättelser och tillägg i Redmines eget beteende, en avstängbar modul per sak, skrivna som patchar till Redmine"
  text_gk_core_stuff_in_core: "Redmine har redan det här (inställningarna finns under Administration > Inställningar > Ärendehantering). Modulen kopplar inte in sig."
  label_gk_core_stuff_module_on: "På"
  label_gk_core_stuff_done_ratio_text: "% Klart som text"
  text_gk_core_stuff_done_ratio_text_info: "Procenten som text vid stapeln i ärendelistor och för fält av typen Progress bar i listor, så att värdet kan kopieras och läsas av skärmläsare. Ärendesidan och versionerna har redan texten."
  label_gk_core_stuff_position: "Placering"
  text_gk_core_stuff_position_info: "Var procenttalet står: bredvid stapeln, på den, under den, eller dolt men kvar för skärmläsare och kopiering."
  label_gk_core_stuff_position_right: "Bredvid stapeln"
  label_gk_core_stuff_position_over: "På stapeln"
  label_gk_core_stuff_position_under: "Under stapeln"
  label_gk_core_stuff_position_hidden: "Dold (skärmläsare och kopiering)"
  label_gk_core_stuff_zero: "Visa 0 % som text"
  label_gk_core_stuff_full: "Visa 100 % som text"
  label_gk_core_stuff_done_ratio_plate: "Platta bakom texten"
  text_gk_core_stuff_done_ratio_plate: "När texten står på stapeln får den en ljus platta bakom sig, så att den läses mot både den gröna och den grå delen. Av: Redmines vita skugga runt texten."
  # exports: the names of core's exports (GkCoreStuff::Exports), for revisions' rule
  label_gk_core_stuff_export_issues: "Ärendelista"
  label_gk_core_stuff_export_issue: "Ärende"
  label_gk_core_stuff_export_timelog: "Tidrapporter"
  label_gk_core_stuff_export_time_report: "Tidsrapport"
  label_gk_core_stuff_export_users: "Användare"
  label_gk_core_stuff_export_projects: "Projekt"
  label_gk_core_stuff_export_members: "Medlemmar"
  label_gk_core_stuff_export_permissions: "Behörigheter"
  label_gk_core_stuff_export_issue_report: "Ärenderapport"
  label_gk_core_stuff_export_gantt: "Gantt"
  label_gk_core_stuff_export_wiki_page: "Wikisida"
  label_gk_core_stuff_export_wiki: "Wiki"
  label_gk_core_stuff_export_version: "Version"
  label_gk_core_stuff_single_preference: "En inställningsrad per användare"
  text_gk_core_stuff_single_preference_info: "Redmine kan få två rader med en användares inställningar och läser då den ena och sparar den andra, så att det som sparats går förlorat. Modulen läser alltid den äldsta raden, frågar databasen innan en ny skapas och slår ihop extra rader till en."
  # avatar_sources
  label_gk_core_stuff_avatar_sources: "Källor för bilder på användare"
  text_gk_core_stuff_avatar_sources_info: "Andra plugin kan anmäla källor för bilden på en användare (till exempel en egen bild, en ikon eller organisationens bildmapp). Källorna frågas i tur och ordning före Gravatar; den första som har en bild vinner. Utan anmälda källor, eller av, är bilden Redmines egen."
  label_gk_core_stuff_avatar_sources_now: "Anmälda källor"
  # footer_version
  label_gk_core_stuff_footer_version: "Redmines version i sidfoten"
  text_gk_core_stuff_footer_version_info: "Påslagen står versionen (%{version}) efter Powered by Redmine i sidfoten, för alla som ser sidan, också den som inte är inloggad. Bara Redmines version, inte pluginens. Gäller sidorna i webbläsaren, inte PDF:er eller exporter. Där ett annat plugin ritar sin egen sidram i stället för Redmines syns versionen inte. Har Redmines rad tagits bort (GK GUI Stuff, Dolt) syns versionen inte här; skriv då <version> i GK GUI Stuff:s egen rad i sidfoten."
  # minimagick_path
  label_gk_core_stuff_minimagick_path: "Gantt som PNG med ImageMagick 7"
  text_gk_core_stuff_minimagick_path_info: "Påslagen ritas Gantt som PNG med den ImageMagick som imagemagick_convert_command i configuration.yml pekar på, när den är ImageMagick 7 (magick). Utan den kör Redmine kommandot convert ur sökvägen, som i Windows är ett annat program, och PNG:en ger ett internt fel. Gäller efter omstart."
  # settings_tabs
  label_gk_core_stuff_settings_tabs: "Register för flikar"
  text_gk_core_stuff_settings_tabs_info: "Andra plugin kan anmäla flikar på projektets, administrationens, användarens och gruppens inställningar och i ärendets historik, i stället för att skriva över Redmines hjälpmetoder. Modulen går inte att stänga av, eftersom andra GK-plugin visar sina flikar genom registret. Utan anmälningar är sidorna Redmines egna."
  label_gk_core_stuff_settings_tabs_now: "Anmälda flikar"
  # journal_details
  label_gk_core_stuff_journal_details: "Register för historikrader"
  text_gk_core_stuff_journal_details_info: "Andra plugin kan anmäla hur deras egna rader i ärendets historik ritas, på sidan, i mejlet och som text, i stället för att skriva över Redmines hjälpmetod. Modulen går inte att stänga av, eftersom andra GK-plugin visar sina rader genom registret. Utan anmälningar är raderna Redmines egna."
  label_gk_core_stuff_journal_details_now: "Anmälda rader"
  # formatting_processors
  label_gk_core_stuff_formatting_processors: "Länkar och text i formaterad text"
  text_gk_core_stuff_formatting_processors_info: "Andra plugin kan märka länkarna och orden i formaterad text (wikisidor, beskrivningar, anteckningar) i ett gemensamt pass efter att texten formaterats, i stället för att var och en läser och skriver om den färdiga sidan. Länkarna i egna fälts värden (formatet Länk och länkmönster) går genom samma pass. Modulen går inte att stänga av, eftersom andra GK-plugin märker länkar, ikoner och taggar genom den. Utan anmälningar är texten Redmines egen och läses inte om."
  label_gk_core_stuff_formatting_processors_now: "Anmälda plugin"
  text_gk_core_stuff_formatting_processors_values_info: "Redmine märker själv den formaterade texten. Länkarna i egna fälts värden (formatet Länk och länkmönster) går fortfarande genom det här pluginets pass, med de plugin som är anmälda här."
  # report_marks
  label_gk_core_stuff_report_marks: "Märken i ärenderapporterna"
  text_gk_core_stuff_report_marks_info: "Varje antal i ärenderapporterna (Översikt och den detaljerade tabellen) står i ett märke som säger om det är en status (med statusens id och om den är stängd), de öppna, de stängda eller totalt, så att andra plugin vet vad en kolumn är utan att gå på dess plats, rubrikens ord eller statusens namn. Modulen går inte att stänga av; märkena syns inte, och utan plugin som läser dem ser rapporten ut som Redmines."
  # principal_marks
  label_gk_core_stuff_principal_marks: "Märken på länkarna till personer och grupper"
  text_gk_core_stuff_principal_marks_info: "Varje länk till en användare eller en grupp får ett märke med användarens eller gruppens id, så att andra plugin vet vems namnet är utan att gå på länkens adress eller text. Där Redmine bara skriver namnet, utan länk, blir det inget märke. Modulen går inte att stänga av; märket syns inte, och länkarna ser ut som Redmines."
  # breadcrumb_marks
  label_gk_core_stuff_breadcrumb_marks: "Märken i sidhuvudets projektväg"
  text_gk_core_stuff_breadcrumb_marks_info: "Varje projektlänk i projektvägen överst på sidan (huvudprojektet och projekten däremellan) får ett märke med projektets identifierare, så att andra plugin vet vart en länk leder utan att räkna länkar och avgränsare. Modulen går inte att stänga av; märket syns inte, och projektvägen ser ut som Redmines."
  # menu_marks
  label_gk_core_stuff_menu_marks: "Märken på menyernas länkar"
  text_gk_core_stuff_menu_marks_info: "Varje länk som Redmine ritar i en meny (toppmenyn, kontomenyn, projektets flikar, administrationen) får ett märke med menyns namn, så att andra plugin vet vilken meny en länk står i utan att gå på var länken sitter på sidan. Modulen går inte att stänga av; märket syns inte, och menyerna ser ut som Redmines."
  # the hooks in core's views (layout_hooks, action_menus, form_hooks, list_hooks, more_view_hooks) and the marks (section_marks, anchor_marks)
  label_gk_core_stuff_view_hooks: "Krokar i Redmines vyer"
  text_gk_core_stuff_view_hooks_info: "Andra plugin kan lägga in innehåll och åtgärder i Redmines sidor genom krokar, i stället för att skriva över Redmines vyer. Vyerna är Redmines egna med krokarna tillagda, en kopia per Redmine-version. Modulerna går inte att stänga av; utan plugin som använder krokarna ser sidorna ut som Redmines. Ersätter ett plugin redan en av vyerna används pluginets."
  label_gk_core_stuff_view_hooks_views: "Vyer för den här Redmine-versionen"
  label_gk_core_stuff_view_hooks_used: "Används"
  label_gk_core_stuff_view_hooks_always: "Alltid på"
  text_gk_core_stuff_view_hooks_shadowed: "Ett plugin ersätter %{views}; där används pluginets vy, utan krokarna."
  text_gk_core_stuff_view_marks_shadowed: "Ett plugin ersätter %{views}; där används pluginets vy, utan markeringarna, och plugin som går på dem hittar inte det som markeras där."
  text_gk_core_stuff_view_marks_views_missing: "saknas; sidorna får inga markeringar, och plugin som går på dem hittar inte det som markeras"
  label_gk_core_stuff_layout_hooks: "Sidans ram"
  text_gk_core_stuff_layout_hooks_info: "Överst och nederst i huvudet och sidfoten, överst i innehållet och sidopanelen, efter sidans rubrik och runt ärendet på ärendesidan."
  label_gk_core_stuff_action_menus: "Knappraden och menyerna"
  text_gk_core_stuff_action_menus_info: "Knappraden på sexton sidor, åtgärdsmenyn på åtta, och menyer för ett ärende, högerklicksmenyn i ärendelistan, ett projekt, en användare och en version."
  label_gk_core_stuff_form_hooks: "Formulären"
  text_gk_core_stuff_form_hooks_info: "Överst och nederst i sju formulär (grupp, ärende och dess egna fält, projekt, ärendetyp, användare, version) och efter ärendets rubrik, beskrivning och fält, användarens inloggning och e-postaviseringar."
  label_gk_core_stuff_list_hooks: "Listorna"
  text_gk_core_stuff_list_hooks_info: "Klasser på en rad och innehåll efter raden i listorna över ärenden, projekt och användare."
  label_gk_core_stuff_anchor_marks: "Markeringar på sidorna"
  text_gk_core_stuff_anchor_marks_info: "Fasta markeringar (klasser och data-attribut) på delar av Redmines sidor som andra plugin ändrar: sidhuvudets titel, ärendets rubrik och ämne, namnkolumnen i arbetsflödets tabeller, kolumnerna i ärenderapporten, raderna i en fillista, raderna i ärendeformuläret och massredigeringen, tabellen för versionshantering, frågeformulärets knappar och Gantt-schemats och kalenderns val, Ta bort i högerklicksmenyn, ärendeformulärets egenskaper och länken som öppnar beskrivningen, Lägg till för underaktiviteter och relaterade ärenden, och Spara i massredigeringen och inställningarna. Inga krokar; utan plugin som läser markeringarna ser sidorna ut som Redmines."
  label_gk_core_stuff_more_view_hooks: "Fler platser"
  text_gk_core_stuff_more_view_hooks_info: "Efter länken till Redmine i sidfoten, efter författarraden på ärendesidan, under ett dokuments uppgifter, bredvid Spara i varje inställningsformulär, efter rutan Information på Mitt konto, före ärendelistan på dess sida och överst i varje ärendelista, också i blocken på Min sida."
  label_gk_core_stuff_section_marks: "Ärendesidans delar"
  text_gk_core_stuff_section_marks_info: "Fasta markeringar på ärendesidans delar (Beskrivning, Filer, Underaktiviteter, Relaterade ärenden) och deras rubriker, så att andra plugin hittar en del utan att gå på rubrikens ord. Inga krokar; utan plugin som läser markeringarna ser sidan ut som Redmines."
  text_gk_core_stuff_layout_hooks_views_ok: "finns"
  text_gk_core_stuff_layout_hooks_views_missing: "saknas; krokarna i vyerna anropas inte"
  # time_ampm_nbsp
  label_gk_core_stuff_time_ampm_nbsp: "AM/PM på samma rad som klockslaget"
  text_gk_core_stuff_time_ampm_nbsp_info: "Ett klockslag med 12-timmarsklocka (10:44 AM) får ett hårt mellanslag före AM eller PM, så att en smal kolumn aldrig lämnar AM eller PM ensamt på nästa rad. En 24-timmarsklocka ändras inte, och en CSV behåller det vanliga mellanslaget så att ett kalkylark läser tiden som förut. Ändringen ligger inne i texten och har inget eget element, så markeringen efter en sparning räknar inga ställen för den."
  # the looks: fixes of how core's own pages look or read
  label_gk_core_stuff_list_badge: "Statusmärken mitt i listans rad"
  text_gk_core_stuff_list_badge_info: "Redmine lyfter ett statusmärke (som Låst eller Krävs) 4 px för att det ska sitta rätt bredvid en rubrik. I en lista står det i stället mitt i raden, som texten bredvid."
  label_gk_core_stuff_list_hash: "# framför ärendenumret i listor"
  text_gk_core_stuff_list_hash_info: "Ärendenumret i ärendelistor skrivs med # framför, som på alla andra ställen (#12)."
  label_gk_core_stuff_heading_badge: "Statusmärken mitt för rubriken"
  text_gk_core_stuff_heading_badge_info: "Statusmärkena efter en sidas rubrik (ärendets status, Privat) står mitt för rubrikens bokstäver i stället för Redmines lyft på 4 px."
  label_gk_core_stuff_list_checkbox: "Radens kryssruta mitt i raden"
  text_gk_core_stuff_list_checkbox_info: "Kryssrutan först i en listas rad står mitt i raden; Redmine lägger den lite för lågt."
  label_gk_core_stuff_dark_mode: "Mörkt läge"
  label_gk_core_stuff_dark_mode_mode: "Ljust, mörkt eller automatiskt"
  label_gk_core_stuff_dark_mode_light: "Ljust"
  label_gk_core_stuff_dark_mode_dark: "Mörkt"
  label_gk_core_stuff_dark_mode_auto: "Automatiskt"
  text_gk_core_stuff_dark_mode_choice_info: "Gäller under Tvingat, för alla, och för den som inte är inloggad. Under Valfritt väljer var och en själv, och den som inte har valt följer enheten."
  text_gk_core_stuff_dark_mode_info: "Ljust, mörkt eller automatiskt för Redmines sidor. Automatiskt följer telefonens eller datorns inställning och byter när enheten byter. Av: inget mörkt läge, sidorna är alltid ljusa. Valfritt: var och en väljer ljust, mörkt eller automatiskt under Mitt konto, Utseende, och den som inte har valt följer enheten. Tvingat: värdet här gäller alla. Det mörka läget täcker Redmines egen sida, menyerna, tabellerna, formulären, meddelandena, flikarna, historiken, wikin, kalendern och brickorna; sidhuvudet och toppmenyn behåller Redmines färger, och kod behåller sin ljusa grund så att färgläggningen läses som i det ljusa läget. Ett tema kan lägga sina egna färger ovanpå. Utskrivna sidor är alltid ljusa."
  label_gk_core_stuff_chart_colors: "Diagrammen i sidans färger"
  text_gk_core_stuff_chart_colors_info: "Av från början: Redmines egna diagramfärger gäller tills någon slår på det här. När det är på och sidan är mörk, eller när ett tema ritar sidan, tar Redmines diagram (ärenderapportens detaljer och arkivets statistik) kategorifärgerna i tur och ordning och börjar om efter tio: kanten i färgen och fyllningen i dess mjuka ton. Text, rutnät, axlar och tipsrutan följer sidans färger. Arkivets revisionsgraf och linjerna i Gantt-diagrammets rityta (relationslinjerna och framstegslinjen) behåller sina kulörer men blir så ljusa eller mörka att de håller kontrasten 3:1 mot ytan, och likaså Gantt-diagrammets linje för i dag, som framstegslinjen tar sin färg från. Färgrutorna i Gantt-diagrammets filter är som Redmine ritar dem. I ljust läge utan tema ändras ingenting, och ett diagram ritas om när läget byts på en öppen sida."
  label_gk_core_stuff_sidebar_spacing: "Avstånd mellan sidofältets block"
  text_gk_core_stuff_sidebar_spacing_info: "Ett plugins block i sidofältet (till exempel Taggar) får samma avstånd till blocket ovanför som Redmines egna block har mellan sig."
  label_gk_core_stuff_label_rows: "Text i linje med sin etikett"
  text_gk_core_stuff_label_rows_info: "En rad i ett formulär som bara har text eller en länk (inget fält) står på samma linje som etiketten till vänster; Redmine lägger den 1 till 2 px för högt."
  label_gk_core_stuff_scm_table: "Versionsarkivens tabell som en lista"
  text_gk_core_stuff_scm_table_info: "Tabellen Aktivera SCM under Administration, Inställningar, Versionsarkiv ritas som Redmines andra listor: en rubrikrad, linjer mellan raderna, namn och kommandon i början av kolumnerna."
  label_gk_core_stuff_warning_balance: "Lika marginal i rutor utan ikon"
  text_gk_core_stuff_warning_balance_info: "Redmine håller 30 px i början av en varnings- eller inforuta för en ikon. Utan ikon får rutan samma marginal på båda sidor."
  label_gk_core_stuff_menu_icons: "Menyernas ikoner i radens färg"
  text_gk_core_stuff_menu_icons_info: "I en meny (knappradens och anteckningens ..., ärendelistans högerklick) visar raden var pekaren är med ram, bakgrund och blå text, men Redmine gör ikonen röd som i en vanlig länk. Ikonen får radens färg."
  label_gk_core_stuff_role_progress_text: "Texten på en förloppsmätare"
  label_gk_core_stuff_role_progress_plate: "Plattan bakom texten på en förloppsmätare"
  label_gk_core_stuff_external_links: "Externa länkar syns som externa"
  text_gk_core_stuff_external_links_info: "En länk till en annan webbplats i en text får färgen för det externa, en prickad understrykning och en ikon efter länktexten i stället för Redmines lilla bild före; ikonen hamnar aldrig ensam på en ny rad. Med GK GUI Stuff står domänen i tipset och ritas en länk till instansens egen adress som en intern länk. En länk till en e-postadress får Redmines ikon för e-post. Ikonerna skrivs inte ut."
  label_gk_core_stuff_ext_place_field_link: "Anpassade fält av formatet Länk"
  text_gk_core_stuff_ext_place_field_link_info: "Länken i ett anpassat fält av formatet Länk syns som extern, på sidan och i listorna. Markeras med GK GUI Stuff."
  label_gk_core_stuff_ext_place_url_pattern: "Länka värden till URL"
  text_gk_core_stuff_ext_place_url_pattern_info: "Länken som ett anpassat fält av ett annat format får genom Länka värden till URL syns som extern. Markeras med GK GUI Stuff."
  label_gk_core_stuff_ext_place_project_homepage: "Projektets hemsida"
  text_gk_core_stuff_ext_place_project_homepage_info: "Hemsidan på projektets översikt syns som extern, som i projektlistan. Markeras med GK GUI Stuff."
  label_gk_core_stuff_ext_place_people: "GK People: webbplats, kanaler och identifierare"
  text_gk_core_stuff_ext_place_people_info: "Organisationens webbplats och personens länkar under Nå personen och Identifierare syns som externa. Markeras med GK GUI Stuff när GK People finns."
  label_gk_core_stuff_ext_place_icons: "GK Icons: paketens hemsida och nedladdning"
  text_gk_core_stuff_ext_place_icons_info: "Länkarna till ikonpaketens hemsida och nedladdning under Recept för vanliga paket syns som externa. Markeras med GK GUI Stuff när GK Icons finns."
  label_gk_core_stuff_block_icons: "Flytthandtag i ikonernas färg"
  text_gk_core_stuff_block_icons_info: "Flytthandtaget i listor som går att sortera (anpassade fält, ärendetyper, statusar, värdelistor, roller) och i ett blocks rubrik på Min sida får samma färg som ikonerna bredvid (Redmine gör det grått), och blockets två grupper av ikoner på Min sida får samma avstånd som ikonerna inom en grupp."
  label_gk_core_stuff_list_align: "Rubriker som sina kolumner"
  text_gk_core_stuff_list_align_info: "En rubrik i en lista ställs som kolumnens celler när alla står i början (eller i slutet); Redmine centrerar alla rubriker. Kolumner med beskrivningar, anteckningar, kommentarer eller anpassade textfält ställs i början. Gäller listor där Redmine ger rubrik och celler kolumnens klass (ärenden, tidloggar, projekt, användare); andra listor behåller Redmines rubriker."
  label_gk_core_stuff_field_widths: "Lika breda fält under varandra"
  text_gk_core_stuff_field_widths_info: "Listor och textfält som står direkt under varandra i ett formulär, ett per rad, får samma bredd som det bredaste av dem, också när en förklarande text står emellan. Ett textområde, en kryssruta, ett fält som börjar på annat ställe eller ett nytt avsnitt bryter raden av fält, och fälten på andra ställen behåller sina egna bredder."
  label_gk_core_stuff_settings_widths: "Lika breda fält i Redmines inställningar"
  text_gk_core_stuff_settings_widths_info: "På Redmines inställningssidor får alla listor och textfält i en ruta (eller ett avsnitt av den) samma bredd som det bredaste av dem, också med kryssrutor och förklaringar emellan. Ett fält som Redmine gör kort med avsikt (som ett tal) behåller sin bredd."
  label_gk_core_stuff_control_heights: "Lika höga knappar och fält"
  text_gk_core_stuff_control_heights_info: "Knappar och fält i samma formulär som står bredvid varandra på samma rad (ett filter, en rad i ett formulär) får samma höjd som det högsta av dem, också på Redmines sidor."
  label_gk_core_stuff_submit_word: "Spara i stället för Skicka"
  text_gk_core_stuff_submit_word_info: "Knappen som sparar ett formulär får Redmines eget ord för Spara i stället för ordet för Skicka, på det språk du har."
  label_gk_core_stuff_ajax_indicator: "Laddar-rutan mitt på listan"
  text_gk_core_stuff_ajax_indicator_info: "När något laddas från en lista (radens meny, ändring av markerade rader) står Redmines ruta Laddar... mitt på listan, på den eller de markerade raderna, i stället för mitt i fönstret. Rutan själv är Redmines."
  label_gk_core_stuff_native_texts: "Webbläsarens texter på sidans språk"
  text_gk_core_stuff_native_texts_info: "Meddelandet för ett fält som måste fyllas i eller har fel form, och filfältets knapp och text, skrivs på sidans språk i stället för webbläsarens."
  label_gk_core_stuff_list_sort: "Kryssrutor i bokstavsordning"
  text_gk_core_stuff_list_sort_info: "Kryssrutor som Redmine visar i sin egen ordning (en ärendetyps projekt och anpassade fält, ett anpassat fälts projekt) visas i bokstavsordning, projekten under sitt överordnade projekt. Bara ordningen på skärmen ändras: samma rutor och samma värden skickas."
  text_gk_core_stuff_step_list_sort_1: "Öppna en ärendetyp under Administration, Ärendetyper."
  text_gk_core_stuff_step_list_sort_2: "Projekten och de anpassade fälten står i bokstavsordning, projekten under sitt överordnade projekt."
  text_gk_core_stuff_step_list_sort_3: "Bara ordningen på skärmen ändras: samma rutor och samma värden skickas."
